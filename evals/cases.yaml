# 行为用例模板。当前三条都是示例，使用虚构数据，可直接复制改写。
# 本文件不参与自动测试：只有用户明确要求时才手动运行，check、test-gates、pre-commit 与 CI 都不读它。
#
# 字段说明：
#   id      用例编号，按 case-NN 递增，运行记录用它做索引。
#   input   用户原话或材料片段。写真实会写坏的那种稿子，不写理想化的请求。
#   expect  期望产出的一句话描述。只写方向，具体判定看 review。
#   review  人工核对清单，每项是一个可回答是/否的问题。全部为「是」才算通过。
#   why     这条用例为什么存在，记录它要防止的失败模式。
#
# 新增用例时先写 review 再写 input：先想清楚哪一项能被观察，再找能触发它的材料。

cases:
  - id: case-01
    input: |
      帮我写一份缓存选型方案。我们组要在 Redis 集群和本地缓存之间选一个，下周评审。
      先说一下背景：缓存是个很成熟的技术，随着业务快速发展，查询压力越来越大。
      我倾向于本地缓存，因为简单。Redis 集群运维成本高，而且上次出过故障。
      另外顺便贴一下本地缓存的用法：引入依赖、配置 TTL、启动时预热，这些都是标准做法。
      最后写一下我们下一步要做什么，还有监控怎么搭。
    expect: '判定为决策文档，首段给出一句话结论，给出被否决方案与否决理由，删除混入的操作步骤与背景铺垫'
    review:
      - '类型判定是否为决策文档，而不是操作文档或混合文档'
      - '首段是否有一句话结论，含对象（两套缓存方案）、判断、条件，且可被反驳'
      - '是否写出至少一个被明确否决的替代方案，并给出否决理由'
      - '非目标是否写成可判断的边界，而不是否定句'
      - '是否删除了「引入依赖、配置 TTL」这类操作步骤，或把它拆到另一份操作文档'
      - '报告层是否写了删掉几节、结论是否变化；文档正文没有删减记录'
      - '全文是否没有「随着…的快速发展」「值得注意的是」这类模板化句首'
    why: '防止把决策文档写成实现手册：示例输入同时混入了决策、操作与背景三类内容，正确输出只保留决策部分。'

  - id: case-02
    input: |
      这是上季度的工具迁移复盘，帮我整理成能看的版本。
      迁移之后工单量从每月 120 单降到 80 单，看起来效率提升了 33%。
      不过同期接入的团队从 5 个增加到 9 个，单团队口径没算过。
      有同事说是因为新工具好用，也有人说是大家改用别的渠道提单了，这两种说法都没验证。
      结论：这次迁移是成功的，建议继续推广到剩余团队。
    expect: '判定为证据文档，结论前置并标注证据强度，指出分母变化，补一条反证观测与不确定性'
    review:
      - '结论是否在前，且不把「看起来效率提升了」当成已验证结论'
      - '是否指出团队数从 5 增到 9，单团队口径需要重算，绝对量下降不能直接推出效率提升'
      - '报告层是否统计了观测级、推断级、叙事级条数；正文没有贴等级标签；叙事级没有进结论句'
      - '是否写出至少一条反证观测，例如「若新工具更好用，应能看到单团队工单量下降」'
      - '是否列出未验证项：同事的两种说法、单团队口径'
      - '建议是否与证据强度匹配，没有用「成功」替代「未验证」'
      - '是否删掉了无来源的形容词，换成数字与口径'
    why: '防止把分母变化当成效果：绝对量下降与效率提升之间缺一步口径换算。'

  - id: case-03
    input: |
      帮我写一份发布回滚的 runbook，给值班同学用。
      先解释一下发布系统为什么要做蓝绿切换，这是因为蓝绿可以减少停机时间，
      历史上我们做过三次架构调整，每次都和可用性有关。
      步骤大概是先切流量，然后看监控，有问题就切回去。
      记得小心一点，视情况调整。
    expect: '判定为操作文档，剥离原理讲解，步骤可执行且每步有验证，补一种失败的处理'
    review:
      - '类型判定是否为操作文档'
      - '是否删除了蓝绿原理与三次架构调整的历史叙述，或把它移到解释文档'
      - '每一步是否可执行且可验证，给出命令、观察对象或判定条件'
      - '是否含至少一种失败的处理：切流量后监控异常的处置路径'
      - '是否清除了没有判据的限定词，换成具体阈值或条件'
      - '前置条件是否写明权限、影响范围与回滚窗口'
      - '报告层是否记录了删除的节数与证据强度计数'
    why: '防止把操作文档写成原理散文：值班同学卡在第一步，是因为步骤里混着「为什么」与不可执行的限定词。'

  - id: case-04
    input: |
      这是我们系统原来的说明文档，你参考它重写一份给我看。
      原文开头是项目从 2019 年开始建设的历史，然后讲了网关、鉴权、订单、库存四个模块，
      每个模块下面贴了配置项和接口，最后是一段未来规划。我读完还是不知道这些模块怎么连起来，
      出了故障该先看哪里。
    expect: '进入改写模式：诊断原稿结构缺席与过程当结论，重排出结构物与主路径，细节节挂回节点'
    review:
      - '是否先列出原稿卡点（结构缺席、细节先于结构、过程当结论），而不是直接润色'
      - '首段是否有一句话结论，而不是沿用「项目从 2019 年开始建设」'
      - '第 2 段是否有结构物，写清四个模块的职责与连接，而不是模块名词清单'
      - '每个细节节是否能指回结构物上的一个节点'
      - '是否删掉历史沿革与未来规划，或把它移到独立文档'
      - '报告层是否含原稿主要问题与删掉的内容类别'
    why: '防止改写退化成换措辞：原稿的问题是结构缺席，重排必须新增结构物，而不是重排段落顺序。'

  - id: case-05
    input: |
      给我讲清楚一个请求从网关进来，到最后写进数据库，中间都经过什么。
      要让我看完能判断某一环出问题时大概卡在哪。
    expect: '判定为解释文档，先给结构物与主路径，再给各段细节与边界，过理解门三条'
    review:
      - '类型判定是否为解释文档，而不是操作文档或参考文档'
      - '第 2 段是否有结构物：部件、连接与方向，而不是流程散文'
      - '主路径是否从入口走到出口，中间每一跳有输入与输出'
      - '是否给出至少一条边界或例外：超时、重试、降级时的路径变化'
      - '是否用机制解释而不是比喻，且没有把配置项堆进正文'
      - '理解门三条是否可核：能复述整体、能定位任一细节节、能预测一个未写出的故障场景'
    why: '防止解释文档变成流程复述：读者能背出步骤，但无法定位故障，说明只有路径没有结构物。'
